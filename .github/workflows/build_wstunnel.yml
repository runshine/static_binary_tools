name: build_wstunnel
on:
  push:
    branches:
      - '**'
    paths:
      - .github/workflows/build_wstunnel.yml
      - build/wstunnel/*
      - build/common/*
      - Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_name: x86_64
            rust_target: x86_64-unknown-linux-musl
            output_arch: x86_64
          - build_name: aarch64
            rust_target: aarch64-unknown-linux-musl
            output_arch: aarch64
          - build_name: armhf
            rust_target: armv7-unknown-linux-musleabihf
            output_arch: armhf
          - build_name: armel
            rust_target: armv5te-unknown-linux-musleabi
            output_arch: armel
          - build_name: riscv64
            rust_target: riscv64gc-unknown-linux-musl
            output_arch: riscv64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust build deps
        run: |
          apt-get update
          apt-get install -y bash curl ca-certificates git build-essential pkg-config file perl cmake xz-utils

      - name: Build binary
        run: |
          pwd
          echo "HOME=$HOME"
          echo "PATH=$PATH"
          ls -la . || true
          ls -la build || true
          ls -la build/wstunnel || true
          script_path="$(find . -path './build/wstunnel/build.sh' -print -quit)"
          echo "script_path=$script_path"
          if [ -z "$script_path" ]; then
            echo "build/wstunnel/build.sh not found"
            exit 1
          fi
          /bin/bash "$script_path"
        env:
          PATH: /github/home/.cargo/bin:/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          RUST_TARGET: ${{ matrix.rust_target }}
          OUTPUT_ARCH: ${{ matrix.output_arch }}

      - name: Upload binary to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wstunnel-v10.6.2-linux-${{ matrix.build_name }}.tar.gz
          path: build/wstunnel/install/wstunnel-v10.6.2-linux-${{ matrix.output_arch }}.tar.gz

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0
          name: "Release v1.0"
          artifacts: "build/wstunnel/install/*"
          artifactErrorsFailBuild: false
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
